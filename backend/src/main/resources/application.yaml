spring:
  application:
    name: watchvault

  # Secrets come from environment variables only (see backend/.env.example).
  # No default for the password, so the app fails fast if it is missing.
  datasource:
    # Run the MySQL session in UTC so DB defaults (CURRENT_TIMESTAMP) match what Hibernate writes.
    url: jdbc:mysql://localhost:3306/watchvault?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${WATCHVAULT_DB_USERNAME:watchvault_app}
    password: ${WATCHVAULT_DB_PASSWORD}

  jpa:
    # Flyway owns the schema; Hibernate only checks the entities match it.
    hibernate:
      ddl-auto: validate
    # Keep database work inside services, not in the web layer.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

watchvault:
  auth:
    # No default: the app refuses to start without it (see backend/.env.example).
    jwt-secret: ${WATCHVAULT_JWT_SECRET}
    token-lifetime: 8h
    cookie-name: watchvault_token
    secure-cookie: true
    max-failed-logins: 5
    failed-login-window: 15m

  # External APIs. Only the backend calls these; the browser never does.
  tmdb:
    base-url: https://api.themoviedb.org/3
    # TMDB "API Read Access Token" (v4 bearer token). Env var only, never committed.
    read-token: ${TMDB_READ_TOKEN}
    language: en-GB
    region: GB
  tvmaze:
    base-url: https://api.tvmaze.com
    country: GB
  cache:
    # Saved TMDB title details: refresh weekly; never keep longer than 180 days (TMDB terms: < 6 months).
    title-refresh-after: 7d
    title-max-age: 180d
  http:
    connect-timeout: 3s
    read-timeout: 5s
    # A user is waiting, so retry briefly; if it still fails we fall back to saved data.
    max-retries: 2
    retry-delay: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health
